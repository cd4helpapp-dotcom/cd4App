# Local stack: PostgreSQL with pgvector, Prisma migrations, the API, and nginx in front.
#   cp .env.example .env
#   docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cd4-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cd4}
      POSTGRES_USER: ${POSTGRES_USER:-cd4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: node:22-alpine
    container_name: cd4-migrate
    working_dir: /prisma
    volumes:
      - ./prisma:/prisma
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cd4}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cd4}
    command: sh -c "npm install --no-audit --no-fund && npx prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: cd4-api
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cd4}
      DATABASE_USERNAME: ${POSTGRES_USER:-cd4}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - uploads-data:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    container_name: cd4-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres-data:
  uploads-data:
